    <!-- Google Analytics (GA4). Measurement ID comes from VITE_GA_MEASUREMENT_ID
         in your .env file — see .env.example. Page views on route changes
         (this is a single-page app) are sent from src/lib/analytics.js. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      // send_page_view disabled here — analytics.js sends page_view manually
      // on every route change so SPA navigation is tracked correctly.
      gtag('config', '%VITE_GA_MEASUREMENT_ID%', { send_page_view: false });
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
