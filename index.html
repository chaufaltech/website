<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon. Google needs a square icon whose size is a multiple of 48px
         (48, 96, 144...) and shows it in search results, so a PNG/ICO is listed
         alongside the SVG. Use a version of the logo with its own solid
         background so it stays visible on Google's white results page. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/logo/logo-icon-dark-background-favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chaufal Tech — Building Trust Through Technology</title>
    <meta name="description" content="Chaufal Tech delivers enterprise-grade websites, software, AI automation, and digital transformation solutions built to solve real business problems." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />

    <!-- Google Analytics is NOT loaded here. It is injected by src/lib/analytics.js
         only after the visitor accepts cookies in the cookie banner. The Measurement
         ID comes from VITE_GA_MEASUREMENT_ID in your .env file. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
